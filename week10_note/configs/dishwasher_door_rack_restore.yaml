task_name: dishwasher_door_rack_restore

runtime:
  task_xml: xml/dishwasher.xml
  object_joint_aliases:
    dishwasher_door_hinge: dishwasher_door_hinge_joint
    dishwasher_rack_slide: dishwasher_rack_slide_joint
  allowed_finger_target_geoms:
    - dishwasher_door_handle
    - dishwasher_rack_handle

initial_state:
  phase: initial
  base: [3.62, 2.28, 0.0]
  arm_qpos: [0.0, -0.55, 0.0, -2.25, 0.0, 1.75, 0.78]
  gripper: 0.04
  object_joints:
    dishwasher_door_hinge: 0.0
    dishwasher_rack_slide: 0.0
  active_target: null

actions:
  - {action: hold_pose, phase: initial_hold, frames: 5}
  - action: move_near_target
    phase: navigate_to_dishwasher
    target_geom: dishwasher_door_handle
    base_offset: [-0.32700001, -0.60800185]
    yaw_offset: 0.05
    heading_axis: [1.0, 0.0, 0.0]
    steps_per_segment: 51
  - action: approach_target
    phase: approach_dishwasher_door
    target_geom: dishwasher_door_handle
    hand_offset: &hand_offset [-0.01626286, -0.11035779, -0.00269677]
    hand_rotation: &hand_rotation
      - [-0.00879656, 0.98738697, 0.15808094]
      - [-0.03796533, -0.15830286, 0.98666045]
      - [0.99924034, 0.00267762, 0.038879]
    approach_direction: &approach_direction [0.0, -1.0, 0.0]
    standoff_distances: [0.45, 0.32, 0.22, 0.14, 0.09]
    max_step: 0.03
  - action: grasp_target
    phase: grasp_dishwasher_door
    target_geom: dishwasher_door_handle
    hand_offset: *hand_offset
    hand_rotation: *hand_rotation
    closed_gripper: 0.023711985
    max_step: 0.025
    close_steps: 17
    minimum_final_finger_contacts: 2
  - action: follow_hinge_joint
    phase: open_dishwasher_door
    joint_name: dishwasher_door_hinge
    moving_body: dishwasher_door
    target_angle: 0.65
    samples: 65
    base_target: [3.52167, 3.40, 0.05]
    max_joint_step: 0.15
    minimum_each_finger_contacts: 2
    ik_position_tolerance: 0.007
    ik_rotation_tolerance: 0.025
    ik_continuity_weight: 0.006
    ik_max_nfev: 1700
  - {action: hold_pose, phase: hold_dishwasher_open, frames: 10}
  - {action: change_gripper, phase: release_dishwasher_door, target: 0.04, active_target: null, steps: 17}
  - action: move_near_target
    phase: reposition_for_rack
    target_geom: dishwasher_rack_handle
    base_offset: [-0.327, -0.700]
    yaw_offset: 0.05
    heading_axis: [1.0, 0.0, 0.0]
    steps_per_segment: 35
  - action: approach_target
    phase: approach_dishwasher_rack
    target_geom: dishwasher_rack_handle
    hand_offset: *hand_offset
    hand_rotation: *hand_rotation
    approach_direction: *approach_direction
    standoff_distances: [0.36, 0.26, 0.18, 0.11, 0.07]
    max_step: 0.03
  - action: grasp_target
    phase: grasp_dishwasher_rack
    target_geom: dishwasher_rack_handle
    hand_offset: *hand_offset
    hand_rotation: *hand_rotation
    closed_gripper: 0.023711985
    max_step: 0.025
    close_steps: 17
    minimum_final_finger_contacts: 2
  - action: follow_slide_joint
    phase: pull_dishwasher_rack
    joint_name: dishwasher_rack_slide
    moving_body: dishwasher_rack
    target_position: 0.24
    samples: 49
    base_target: [3.72167, 3.08, 0.05]
    max_joint_step: 0.15
    minimum_each_finger_contacts: 2
  - {action: hold_pose, phase: inspect_loaded_rack, frames: 10}
  - action: follow_slide_joint
    phase: push_dishwasher_rack
    joint_name: dishwasher_rack_slide
    moving_body: dishwasher_rack
    target_position: 0.0
    samples: 49
    base_target: [3.72167, 3.24553, 0.05]
    max_joint_step: 0.15
    minimum_each_finger_contacts: 2
  - {action: change_gripper, phase: release_dishwasher_rack, target: 0.04, active_target: null, steps: 17}
  - action: retreat_from_target
    phase: retreat_from_rack
    target_geom: dishwasher_rack_handle
    hand_offset: *hand_offset
    hand_rotation: *hand_rotation
    approach_direction: *approach_direction
    standoff_distances: [0.07, 0.11, 0.18, 0.26]
    max_step: 0.03
  - action: move_near_target
    phase: reposition_for_open_door
    target_geom: dishwasher_door_handle
    base_offset: [-0.327, -0.246]
    yaw_offset: 0.05
    heading_axis: [1.0, 0.0, 0.0]
    steps_per_segment: 35
  - action: move_arm
    phase: clear_arm_before_door_regrasp
    waypoints:
      - [0.0, -0.55, 0.0, -2.25, 0.0, 1.75, 0.78]
    max_step: 0.025
  - action: approach_target
    phase: approach_open_dishwasher_door_from_above
    target_geom: dishwasher_door_handle
    hand_offset: *hand_offset
    hand_rotation: *hand_rotation
    approach_direction: [0.0, 0.0, 1.0]
    standoff_distances: [0.25, 0.15, 0.08]
    max_step: 0.03
  - action: grasp_target
    phase: regrasp_dishwasher_door
    target_geom: dishwasher_door_handle
    hand_offset: *hand_offset
    hand_rotation: *hand_rotation
    closed_gripper: 0.023711985
    max_step: 0.025
    close_steps: 17
    minimum_final_finger_contacts: 2
  - action: follow_hinge_joint
    phase: close_dishwasher_door
    joint_name: dishwasher_door_hinge
    moving_body: dishwasher_door
    target_angle: 0.0
    samples: 65
    base_target: [3.52167, 3.40, 0.05]
    max_joint_step: 0.15
    minimum_each_finger_contacts: 2
    ik_position_tolerance: 0.007
    ik_rotation_tolerance: 0.025
    ik_continuity_weight: 0.006
    ik_max_nfev: 1700
  - {action: change_gripper, phase: release_closed_door, target: 0.04, active_target: null, steps: 17}
  - action: retreat_from_target
    phase: retreat_from_dishwasher
    target_geom: dishwasher_door_handle
    hand_offset: *hand_offset
    hand_rotation: *hand_rotation
    approach_direction: *approach_direction
    standoff_distances: [0.06, 0.10, 0.16, 0.24]
    max_step: 0.03
  - action: move_arm
    phase: return_arm_home
    waypoints: [[0.0, -0.55, 0.0, -2.25, 0.0, 1.75, 0.78]]
    max_step: 0.03
  - {action: hold_pose, phase: final_hold, frames: 8}

evaluation:
  joint_goals:
    - {joint_name: dishwasher_door_hinge, reached: 0.65, final: 0.0}
    - {joint_name: dishwasher_rack_slide, reached: 0.24, final: 0.0}
  final_gripper: 0.04
  max_arm_joint_step: 0.15

render:
  width: 720
  height: 540
  max_frames: 190
  duration_ms: 90
  front: {lookat: [3.85, 3.50, 0.95], distance: 2.45, azimuth: 142, elevation: -24}
  top: {lookat: [3.85, 3.40, 0.70], distance: 2.75, azimuth: 180, elevation: -68}
