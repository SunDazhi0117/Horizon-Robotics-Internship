<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>SceneSmith Viewer</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #17191c; color: #f5f5f5; font-family: Arial, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    header {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      padding: 0 16px;
      background: rgba(23, 25, 28, 0.88);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
    }
    h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0; }
    #status { color: #b9c0c8; font-size: 12px; letter-spacing: 0; }
    #status.ready { color: #76d69a; }
    #status.error { color: #ff8585; }
    #joint-panel {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 3;
      width: min(300px, calc(100vw - 24px));
      max-height: calc(100vh - 72px);
      overflow: auto;
      padding: 12px;
      background: rgba(27, 30, 34, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      backdrop-filter: blur(8px);
    }
    #joint-panel[hidden] { display: none; }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .panel-header h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0;
    }
    #reset-joints {
      min-height: 28px;
      padding: 4px 9px;
      color: #f5f5f5;
      background: #343a40;
      border: 1px solid #59616a;
      border-radius: 4px;
      cursor: pointer;
    }
    #reset-joints:hover { background: #414850; }
    .joint-control {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 5px 10px;
      align-items: center;
      margin-top: 10px;
    }
    .joint-control label {
      min-width: 0;
      overflow-wrap: anywhere;
      color: #e5e8eb;
      font-size: 12px;
      letter-spacing: 0;
    }
    .joint-value {
      color: #9fd9b3;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }
    .joint-control input {
      grid-column: 1 / -1;
      width: 100%;
      accent-color: #58b77a;
    }
    .joint-control input:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }
  </style>
  <script src="./three/build/three.min.js"></script>
  <script src="./three/examples/js/controls/OrbitControls.js"></script>
  <script src="./three/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <header>
    <h1 id="viewer-title">SceneSmith 3D Scene</h1>
    <span id="status">Loading model</span>
  </header>
  <section id="joint-panel" aria-label="Articulation controls" hidden>
    <div class="panel-header">
      <h2>Articulated Joints</h2>
      <button id="reset-joints" type="button">Reset</button>
    </div>
    <div id="joint-controls"></div>
  </section>
  <script>
    const params = new URLSearchParams(window.location.search);
    const modelUrl = params.get("model") || "floor_plan_export.glb";
    const focusName = params.get("focus");
    const modelLabel = modelUrl.replace(/^.*\//, "").replace(/\.glb$/i, "");
    document.getElementById("viewer-title").textContent =
      modelLabel.replaceAll("_", " ");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x17191c);

    const camera = new THREE.PerspectiveCamera(
      52,
      window.innerWidth / window.innerHeight,
      0.01,
      1000
    );
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      preserveDrawingBuffer: true
    });
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.screenSpacePanning = true;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x4b5360, 1.7));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(8, 12, 7);
    keyLight.castShadow = true;
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xbad7ff, 1.0);
    fillLight.position.set(-7, 7, -5);
    scene.add(fillLight);

    const status = document.getElementById("status");
    const jointPanel = document.getElementById("joint-panel");
    const jointControls = document.getElementById("joint-controls");
    const resetJoints = document.getElementById("reset-joints");
    const jointLabels = {
      body_to_front_door: "Door",
      body_to_sliding_tray: "Tray",
      tray_to_turntable: "Turntable",
      body_to_upper_knob: "Upper knob",
      body_to_lower_knob: "Lower knob",
      frame_to_door: "Entry door",
      left_hinge: "Cabinet left door",
      right_hinge: "Cabinet right door"
    };
    const jointOrder = Object.keys(jointLabels);

    function blenderAxisToThree(axis) {
      return new THREE.Vector3(axis[0], axis[2], -axis[1]).normalize();
    }

    function setupMicrowaveInterlock(controlsByJoint) {
      const controls = new Map(
        controlsByJoint.map((control) => [control.jointName, control])
      );
      const door = controls.get("body_to_front_door");
      const tray = controls.get("body_to_sliding_tray");
      if (!door || !tray) return () => {};

      const safeDoorAngle = 1.5;
      function sync() {
        const doorIsSafe = Number(door.input.value) >= safeDoorAngle;
        if (!doorIsSafe && Number(tray.input.value) > 0) {
          tray.input.value = "0";
          tray.applyJoint();
        }
        tray.input.disabled = !doorIsSafe;
        tray.input.setAttribute("aria-disabled", String(!doorIsSafe));
        tray.input.title = doorIsSafe
          ? "Microwave tray"
          : "Locked until the microwave door reaches 1.50 rad";
      }

      door.input.addEventListener("input", sync);
      tray.input.addEventListener("input", sync);
      window.viewerInterlocks = {
        microwave: {safeDoorAngle, sync}
      };
      sync();
      return sync;
    }

    function setupJointControls(model) {
      const joints = [];
      model.traverse((node) => {
        if (node.userData?.urdf_joint) joints.push(node);
      });
      if (!joints.length) return;

      joints.sort((left, right) => {
        return jointOrder.indexOf(left.userData.urdf_joint)
          - jointOrder.indexOf(right.userData.urdf_joint);
      });
      const controlsByJoint = [];

      for (const node of joints) {
        const metadata = node.userData;
        const jointName = metadata.urdf_joint;
        const jointType = metadata.joint_type;
        const isPrismatic = jointType === "prismatic";
        const lower = Number.isFinite(metadata.limit_lower)
          ? metadata.limit_lower
          : -Math.PI;
        const upper = Number.isFinite(metadata.limit_upper)
          ? metadata.limit_upper
          : Math.PI;
        const basePosition = node.position.clone();
        const baseQuaternion = node.quaternion.clone();
        const axis = blenderAxisToThree(metadata.axis || [1, 0, 0]);

        const row = document.createElement("div");
        row.className = "joint-control";
        const label = document.createElement("label");
        const input = document.createElement("input");
        const value = document.createElement("span");
        const inputId = `joint-${jointName}`;

        label.htmlFor = inputId;
        label.textContent = jointLabels[jointName] || jointName;
        input.id = inputId;
        input.type = "range";
        input.min = String(lower);
        input.max = String(upper);
        input.step = isPrismatic ? "0.002" : "0.01";
        input.value = "0";
        value.className = "joint-value";

        function applyJoint() {
          const amount = Number(input.value);
          node.position.copy(basePosition);
          node.quaternion.copy(baseQuaternion);
          if (isPrismatic) {
            node.position.addScaledVector(axis, amount);
            value.textContent = `${Math.round(amount * 100)} cm`;
          } else {
            const delta = new THREE.Quaternion().setFromAxisAngle(axis, amount);
            node.quaternion.multiply(delta);
            value.textContent = `${Math.round(THREE.MathUtils.radToDeg(amount))}°`;
          }
          node.updateMatrixWorld(true);
        }

        input.addEventListener("input", applyJoint);
        row.append(label, value, input);
        jointControls.appendChild(row);
        controlsByJoint.push({node, input, applyJoint, jointName});
        applyJoint();
      }

      const syncInterlocks = setupMicrowaveInterlock(controlsByJoint);
      resetJoints.addEventListener("click", () => {
        for (const control of controlsByJoint) {
          control.input.value = "0";
          control.applyJoint();
        }
        syncInterlocks();
      });
      jointPanel.hidden = false;
      window.viewerJoints = controlsByJoint;
    }

    new THREE.GLTFLoader().load(
      modelUrl,
      (gltf) => {
        const model = gltf.scene;
        model.traverse((child) => {
          if (!child.isMesh) return;
          child.frustumCulled = false;
          child.castShadow = true;
          child.receiveShadow = true;
          const materials = Array.isArray(child.material)
            ? child.material
            : [child.material];
          for (const material of materials) {
            if (!material) continue;
            material.side = THREE.DoubleSide;
            material.needsUpdate = true;
          }
        });
        scene.add(model);
        window.viewerModel = model;
        setupJointControls(model);

        let focusObject = null;
        if (focusName) {
          model.traverse((node) => {
            if (
              !focusObject &&
              (node.name === focusName || node.userData?.name === focusName)
            ) {
              focusObject = node;
            }
          });
        }
        const modelBounds = new THREE.Box3().setFromObject(model);
        const modelCenter = modelBounds.getCenter(new THREE.Vector3());
        const bounds = new THREE.Box3().setFromObject(focusObject || model);
        const center = bounds.getCenter(new THREE.Vector3());
        const size = bounds.getSize(new THREE.Vector3());
        const maxDimension = Math.max(size.x, size.y, size.z);
        const distance = focusObject
          ? Math.max(maxDimension * 4, 1.5)
          : Math.max(maxDimension * 1.45, 4);

        if (focusObject) {
          const inward = modelCenter.clone().sub(center);
          inward.y = 0;
          if (inward.lengthSq() < 0.001) inward.set(0, 0, 1);
          inward.normalize();
          camera.position.copy(center).addScaledVector(inward, distance);
          camera.position.y += distance * 0.55;
        } else {
          camera.position.set(
            center.x + distance * 0.9,
            center.y + distance * 0.75,
            center.z + distance * 0.9
          );
        }
        camera.near = Math.max(distance / 1000, 0.01);
        camera.far = distance * 30;
        camera.updateProjectionMatrix();
        controls.target.copy(center);
        controls.update();

        if (!focusObject) {
          const grid = new THREE.GridHelper(
            maxDimension * 2,
            20,
            0x60666e,
            0x383d43
          );
          grid.position.y = bounds.min.y - 0.01;
          scene.add(grid);
        }

        status.textContent = focusName && !focusObject
          ? "Ready (focus not found)"
          : "Ready";
        status.className = "ready";
      },
      undefined,
      (error) => {
        console.error(error);
        status.textContent = "Model failed to load";
        status.className = "error";
      }
    );

    function render() {
      requestAnimationFrame(render);
      controls.update();
      renderer.render(scene, camera);
    }
    render();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
