default_max_gap: 0.000001

scenes:
  - name: pantry_fridge_to_cupboard
    task_config: configs/pantry_fridge_to_cupboard.yaml
    trajectory: results/pantry_fridge_to_cupboard_trajectory.json
    grounded_geoms: [source_ground_plinth, destination_ground_plinth]
    contact_checks:
      - {a: source_ground_plinth, b: source_bottom, label: source cabinet base}
      - {a: source_back, b: source_left, label: source left frame}
      - {a: source_back, b: source_right, label: source right frame}
      - {a: source_door_hinge_pin, b: source_hinge_mount_lower, label: source lower hinge}
      - {a: source_door_handle, b: source_door_handle_bracket, label: source handle bracket}
      - {a: source_door_handle_bracket, b: source_door_panel, label: source bracket to door}
      - {a: source_can_support, b: source_shelf, label: source can pedestal}
      - {a: pantry_can_visual, b: source_can_support, at: initial, label: source can support}
      - {a: destination_ground_plinth, b: destination_bottom, label: destination cabinet base}
      - {a: destination_back, b: destination_left, label: destination left frame}
      - {a: destination_back, b: destination_right, label: destination right frame}
      - {a: destination_door_hinge_pin, b: destination_hinge_mount_lower, label: destination lower hinge}
      - {a: destination_door_handle, b: destination_door_handle_bracket, label: destination handle bracket}
      - {a: destination_door_handle_bracket, b: destination_door_panel, label: destination bracket to door}
      - {a: destination_can_support, b: destination_shelf, label: destination can pedestal}
      - {a: pantry_can_visual, b: destination_can_support, at: final, label: placed can support}

